packages:
  - apps/*
  - packages/*

# pnpm >=11 replaced `onlyBuiltDependencies` with an `allowBuilds` map.
# Anything not listed here fails the install with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  style-dictionary: true
  '@bundled-es-modules/glob': true
  msw: true # transitive dep of the shadcn CLI
  # Ships its native binding as a platform-specific optional dependency, so the
  # postinstall only verifies what is already there. `false` keeps the script from
  # running; verified that eslint resolves imports with it skipped.
  unrs-resolver: false
  # Same shape as unrs-resolver: the native binary arrives as a platform-specific
  # optional dependency, so the postinstall only verifies it. `false` keeps the
  # script from running; the binary is already on disk.
  esbuild: false
  # Transitive of the Agents SDK. Its postinstall only prints a funding message;
  # `false` keeps the script from running.
  core-js-pure: false
