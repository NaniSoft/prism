name: Comment on pull request
description: Create or update one pull request comment keyed on an HTML marker, so a preview never spams.

inputs:
  github-token:
    description: Token with pull-requests write.
    required: true
  body-path:
    description: Path to a file holding the Markdown body.
    required: true
  marker:
    description: The HTML marker that identifies the comment to update.
    required: false
    default: '<!-- prism-release-preview -->'

runs:
  using: composite
  steps:
    - name: Create or update the comment
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      env:
        MARKER: ${{ inputs.marker }}
        BODY_PATH: ${{ inputs.body-path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs')
          const marker = process.env.MARKER
          const body = `${marker}\n${fs.readFileSync(process.env.BODY_PATH, 'utf8')}`
          const issue_number = context.issue.number
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number,
          })
          const existing = comments.find((comment) => comment.body && comment.body.includes(marker))
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            })
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            })
          }
